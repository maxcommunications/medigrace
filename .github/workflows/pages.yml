name: Publish site to GitHub Pages
# main ブランチに更新をプッシュすると、サイト一式を gh-pages ブランチへ自動公開します。
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: .github
          force_orphan: true
          commit_message: "公開: ${{ github.event.head_commit.message }}"
